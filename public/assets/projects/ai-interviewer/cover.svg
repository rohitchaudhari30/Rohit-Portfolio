<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="s4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <radialGradient id="s4glow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#D4A24E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4A24E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#s4bg)"/>
  <rect width="800" height="500" fill="url(#s4glow)"/>

  <!-- app window -->
  <rect x="40" y="40" width="720" height="430" rx="14" fill="#10151F" stroke="#232C3B"/>
  <rect x="40" y="40" width="720" height="46" rx="14" fill="#141B26"/>
  <rect x="40" y="72" width="720" height="14" fill="#141B26"/>
  <circle cx="66" cy="63" r="5" fill="#2A3444"/>
  <circle cx="84" cy="63" r="5" fill="#2A3444"/>
  <circle cx="102" cy="63" r="5" fill="#2A3444"/>
  <rect x="330" y="55" width="140" height="16" rx="8" fill="#1A2230"/>
  <text x="352" y="67" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889">interview.app/session</text>

  <!-- question panel -->
  <rect x="64" y="108" width="672" height="80" rx="12" fill="#141B26" stroke="#D4A24E" stroke-opacity="0.4"/>
  <text x="88" y="134" font-family="ui-monospace, monospace" font-size="10" fill="#8A6A34" letter-spacing="1">QUESTION 4 OF 8 · SYSTEM DESIGN</text>
  <text x="88" y="160" font-family="system-ui, sans-serif" font-size="15" fill="#F4F6F8">How would you design a pipeline to process resumes at scale?</text>

  <!-- candidate answer / waveform -->
  <rect x="64" y="204" width="410" height="140" rx="12" fill="#0D1117" stroke="#232C3B"/>
  <text x="86" y="230" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889" letter-spacing="1">YOUR ANSWER · LIVE TRANSCRIPT</text>
  <g stroke="#E6B563" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="260" x2="100" y2="272"/>
    <line x1="112" y1="250" x2="112" y2="282"/>
    <line x1="124" y1="256" x2="124" y2="276"/>
    <line x1="136" y1="244" x2="136" y2="288"/>
    <line x1="148" y1="252" x2="148" y2="280"/>
    <line x1="160" y1="258" x2="160" y2="274"/>
    <line x1="172" y1="248" x2="172" y2="284"/>
    <line x1="184" y1="256" x2="184" y2="276"/>
    <line x1="196" y1="262" x2="196" y2="270"/>
  </g>
  <circle cx="230" cy="266" r="14" fill="#D4A24E" opacity="0.15"/>
  <circle cx="230" cy="266" r="7" fill="#D4A24E"/>
  <rect x="86" y="302" width="360" height="5" rx="2.5" fill="#2A3444"/>
  <rect x="86" y="314" width="300" height="5" rx="2.5" fill="#2A3444"/>
  <rect x="86" y="326" width="330" height="5" rx="2.5" fill="#2A3444"/>

  <!-- score / feedback card -->
  <rect x="490" y="204" width="246" height="140" rx="12" fill="#141B26" stroke="#232C3B"/>
  <text x="510" y="230" font-family="ui-monospace, monospace" font-size="10" fill="#8A6A34" letter-spacing="1">LIVE SCORING</text>
  <g font-family="ui-monospace, monospace" font-size="10">
    <text x="510" y="256" fill="#93A1B0">Communication</text>
    <rect x="510" y="262" width="200" height="6" rx="3" fill="#232C3B"/>
    <rect x="510" y="262" width="150" height="6" rx="3" fill="#D4A24E"/>

    <text x="510" y="290" fill="#93A1B0">Technical Depth</text>
    <rect x="510" y="296" width="200" height="6" rx="3" fill="#232C3B"/>
    <rect x="510" y="296" width="120" height="6" rx="3" fill="#E6B563"/>

    <text x="510" y="324" fill="#93A1B0">Clarity</text>
    <rect x="510" y="330" width="200" height="6" rx="3" fill="#232C3B"/>
    <rect x="510" y="330" width="170" height="6" rx="3" fill="#D4A24E"/>
  </g>

  <!-- footer controls -->
  <rect x="64" y="368" width="130" height="34" rx="8" fill="none" stroke="#3A4457"/>
  <text x="88" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#93A1B0">Repeat Question</text>
  <rect x="606" y="368" width="130" height="34" rx="8" fill="#D4A24E"/>
  <text x="632" y="390" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0A0D12">Next Question</text>
  <text x="64" y="430" font-family="ui-monospace, monospace" font-size="11" fill="#6B7889">Generated from your resume + the target job description</text>
</svg>
