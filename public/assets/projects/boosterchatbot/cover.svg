<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="s5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <radialGradient id="s5glow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#D4A24E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4A24E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#s5bg)"/>
  <rect width="800" height="500" fill="url(#s5glow)"/>

  <rect x="40" y="40" width="720" height="430" rx="14" fill="#10151F" stroke="#232C3B"/>
  <rect x="40" y="40" width="720" height="46" rx="14" fill="#141B26"/>
  <rect x="40" y="72" width="720" height="14" fill="#141B26"/>
  <circle cx="66" cy="63" r="5" fill="#2A3444"/>
  <circle cx="84" cy="63" r="5" fill="#2A3444"/>
  <circle cx="102" cy="63" r="5" fill="#2A3444"/>
  <rect x="330" y="55" width="140" height="16" rx="8" fill="#1A2230"/>
  <text x="348" y="67" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889">boosterchatbot.app</text>

  <!-- chat thread -->
  <g>
    <rect x="440" y="108" width="270" height="56" rx="16" fill="#1A2230"/>
    <path d="M470 164 l-14 20 l28 -10 Z" fill="#1A2230"/>
    <text x="462" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#F4F6F8">कल की कुल sales</text>
    <text x="462" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#F4F6F8">कितनी हुई?</text>
  </g>

  <g>
    <rect x="90" y="182" width="330" height="96" rx="16" fill="#141B26" stroke="#D4A24E" stroke-opacity="0.4"/>
    <path d="M110 278 l-16 20 l30 -12 Z" fill="#141B26" stroke="#D4A24E" stroke-opacity="0.4"/>
    <circle cx="112" cy="206" r="4" fill="#D4A24E"/>
    <text x="124" y="210" font-family="ui-monospace, monospace" font-size="10" fill="#8A6A34" letter-spacing="1">BOOSTERCHATBOT</text>
    <text x="112" y="234" font-family="system-ui, sans-serif" font-size="13" fill="#F4F6F8">Kal ki total sales ₹4,82,300 thi —</text>
    <text x="112" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#F4F6F8">pichle din se 12% zyada.</text>
    <rect x="112" y="260" width="120" height="4" rx="2" fill="#3A4457"/>
  </g>

  <!-- generated SQL preview -->
  <rect x="440" y="196" width="270" height="120" rx="12" fill="#0D1117" stroke="#232C3B"/>
  <text x="460" y="220" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889" letter-spacing="1">GENERATED T-SQL</text>
  <text x="460" y="242" font-family="ui-monospace, monospace" font-size="11" fill="#93A1B0">SELECT SUM(total)</text>
  <text x="460" y="258" font-family="ui-monospace, monospace" font-size="11" fill="#93A1B0">FROM sales</text>
  <text x="460" y="274" font-family="ui-monospace, monospace" font-size="11" fill="#93A1B0">WHERE sale_date =</text>
  <text x="460" y="290" font-family="ui-monospace, monospace" font-size="11" fill="#93A1B0">  CAST(GETDATE()-1 AS DATE);</text>
  <path d="M460 300 l6 6 l12 -12" stroke="#D4A24E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484" y="303" font-family="ui-monospace, monospace" font-size="10" fill="#7CC98A">validated · read-only</text>

  <!-- language chips -->
  <g font-family="ui-monospace, monospace" font-size="10">
    <rect x="90" y="330" width="70" height="26" rx="13" fill="#1A2230" stroke="#D4A24E" stroke-width="1"/>
    <text x="105" y="347" fill="#D4A24E">English</text>
    <rect x="170" y="330" width="60" height="26" rx="13" fill="#141B26" stroke="#3A4457"/>
    <text x="186" y="347" fill="#93A1B0">हिंदी</text>
    <rect x="240" y="330" width="70" height="26" rx="13" fill="#141B26" stroke="#3A4457"/>
    <text x="253" y="347" fill="#93A1B0">मराठी</text>
    <rect x="320" y="330" width="80" height="26" rx="13" fill="#141B26" stroke="#3A4457"/>
    <text x="334" y="347" fill="#93A1B0">Hinglish</text>
  </g>

  <!-- status row -->
  <rect x="90" y="384" width="620" height="1" fill="#232C3B"/>
  <circle cx="102" cy="410" r="4" fill="#7CC98A"/>
  <text x="114" y="414" font-family="ui-monospace, monospace" font-size="11" fill="#6B7889">Groq active · Gemini standby</text>
  <text x="600" y="414" font-family="ui-monospace, monospace" font-size="11" fill="#6B7889">response · fast</text>
</svg>
