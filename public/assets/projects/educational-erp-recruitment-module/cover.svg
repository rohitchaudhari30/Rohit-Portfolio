    <radialGradient id="s7glow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#D4A24E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D4A24E" stop-opacity="0"/>
