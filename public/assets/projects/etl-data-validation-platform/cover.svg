    <rect x="280" y="106" width="200" height="72" rx="10" fill="#141B26" stroke="#232C3B"/>
    <text x="298" y="130" fill="#8A6A34">GROSS MARGIN</text>
    <text x="298" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#F4F6F8">34.2%</text>

    <rect x="496" y="106" width="240" height="72" rx="10" fill="#141B26" stroke="#D4A24E" stroke-width="1.2"/>
    <text x="514" y="130" fill="#8A6A34">QA CYCLE TIME</text>
    <text x="514" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#D4A24E">-70%</text>
  </g>

  <!-- bar chart -->
  <g>
    <rect x="64" y="204" width="330" height="150" rx="12" fill="#141B26" stroke="#232C3B"/>
    <text x="84" y="228" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889" letter-spacing="1">REGIONAL PERFORMANCE</text>
