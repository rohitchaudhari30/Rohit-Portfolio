      <rect x="140" y="280" width="24" height="54" rx="3" opacity="0.9"/>
      <rect x="180" y="260" width="24" height="74" rx="3"/>
      <rect x="220" y="290" width="24" height="44" rx="3" opacity="0.7"/>
      <rect x="260" y="248" width="24" height="86" rx="3"/>
      <rect x="300" y="272" width="24" height="62" rx="3" opacity="0.8"/>
    </g>
    <line x1="90" y1="334" x2="360" y2="334" stroke="#232C3B"/>
  </g>

  <!-- pipeline run log -->
  <g>
    <rect x="410" y="204" width="326" height="150" rx="12" fill="#141B26" stroke="#232C3B"/>
    <text x="430" y="228" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889" letter-spacing="1">LATEST PIPELINE RUN</text>
    <g font-family="ui-monospace, monospace" font-size="10">
      <path d="M430 248 l5 5 l10 -10" stroke="#7CC98A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="450" y="253" fill="#93A1B0">Schema alignment — passed</text>
      <path d="M430 270 l5 5 l10 -10" stroke="#7CC98A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="450" y="275" fill="#93A1B0">12,480 records validated</text>
      <path d="M430 292 l5 5 l10 -10" stroke="#7CC98A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="450" y="297" fill="#93A1B0">Star schema load — complete</text>
      <circle cx="435" cy="316" r="4" fill="#E6B563"/>
      <text x="450" y="319" fill="#E6B563">Audit log written</text>
    </g>
  </g>

  <!-- geographic map hint -->
  <rect x="64" y="370" width="672" height="60" rx="10" fill="#141B26" stroke="#232C3B"/>
  <text x="84" y="393" font-family="ui-monospace, monospace" font-size="10" fill="#8A6A34" letter-spacing="1">GEOGRAPHIC DRILL-DOWN</text>
