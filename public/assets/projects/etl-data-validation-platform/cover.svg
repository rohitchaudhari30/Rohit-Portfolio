  <circle cx="180" cy="408" r="7" fill="#E6B563"/>
  <circle cx="250" cy="415" r="4" fill="#8A6A34"/>
  <circle cx="320" cy="406" r="6" fill="#D4A24E"/>
  <circle cx="400" cy="412" r="5" fill="#E6B563"/>
  <text x="600" y="415" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889">Power BI · DAX · Power Query</text>
</svg>
