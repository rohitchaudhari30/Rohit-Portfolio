<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="s8bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <radialGradient id="s8glow" cx="75%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#D4A24E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4A24E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#s8bg)"/>
  <rect width="800" height="500" fill="url(#s8glow)"/>

  <!-- host page frame -->
  <rect x="40" y="40" width="720" height="430" rx="14" fill="#10151F" stroke="#232C3B"/>
  <rect x="40" y="40" width="720" height="46" rx="14" fill="#141B26"/>
  <rect x="40" y="72" width="720" height="14" fill="#141B26"/>
  <circle cx="66" cy="63" r="5" fill="#2A3444"/>
  <circle cx="84" cy="63" r="5" fill="#2A3444"/>
  <circle cx="102" cy="63" r="5" fill="#2A3444"/>
  <rect x="330" y="55" width="140" height="16" rx="8" fill="#1A2230"/>
  <text x="340" y="67" font-family="ui-monospace, monospace" font-size="10" fill="#6B7889">your-website.com</text>

  <!-- faint host-page content behind the widget -->
  <g opacity="0.35">
    <rect x="72" y="112" width="260" height="16" rx="4" fill="#232C3B"/>
    <rect x="72" y="140" width="400" height="8" rx="4" fill="#1A2230"/>
    <rect x="72" y="156" width="360" height="8" rx="4" fill="#1A2230"/>
    <rect x="72" y="172" width="380" height="8" rx="4" fill="#1A2230"/>
    <rect x="72" y="210" width="180" height="90" rx="8" fill="#141B26"/>
    <rect x="272" y="210" width="180" height="90" rx="8" fill="#141B26"/>
    <rect x="472" y="210" width="180" height="90" rx="8" fill="#141B26"/>
  </g>

  <!-- floating chat panel -->
  <g>
    <rect x="464" y="112" width="256" height="330" rx="16" fill="#141B26" stroke="#D4A24E" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="464" y="112" width="256" height="52" rx="16" fill="#1A2230"/>
    <circle cx="490" cy="138" r="12" fill="#D4A24E" opacity="0.9"/>
    <text x="490" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0A0D12">Z</text>
    <text x="512" y="134" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F6F8">ZealChatBot</text>
    <text x="512" y="148" font-family="ui-monospace, monospace" font-size="9" fill="#7CC98A">● online</text>
    <circle cx="696" cy="138" r="12" fill="#0D1117"/>
    <path d="M691 133 l10 10 M701 133 l-10 10" stroke="#93A1B0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- message bubbles -->
    <rect x="480" y="180" width="170" height="46" rx="12" fill="#1A2230"/>
    <text x="494" y="199" font-family="system-ui, sans-serif" font-size="10" fill="#C7CFD9">Hi! How can I help</text>
    <text x="494" y="213" font-family="system-ui, sans-serif" font-size="10" fill="#C7CFD9">you today?</text>

    <rect x="530" y="236" width="170" height="34" rx="12" fill="#D4A24E"/>
    <text x="546" y="257" font-family="system-ui, sans-serif" font-size="10" fill="#0A0D12">What are your hours?</text>

    <rect x="480" y="280" width="200" height="46" rx="12" fill="#1A2230"/>
    <text x="494" y="299" font-family="system-ui, sans-serif" font-size="10" fill="#C7CFD9">We're open 9am–6pm,</text>
    <text x="494" y="313" font-family="system-ui, sans-serif" font-size="10" fill="#C7CFD9">Monday to Saturday.</text>

    <!-- recommendation chips -->
    <g font-family="ui-monospace, monospace" font-size="9">
      <rect x="480" y="340" width="92" height="24" rx="12" fill="#0D1117" stroke="#3A4457"/>
      <text x="492" y="356" fill="#93A1B0">Contact us</text>
      <rect x="580" y="340" width="100" height="24" rx="12" fill="#0D1117" stroke="#3A4457"/>
      <text x="592" y="356" fill="#93A1B0">View pricing</text>
    </g>

    <!-- input box -->
    <rect x="480" y="392" width="220" height="34" rx="17" fill="#0D1117" stroke="#3A4457"/>
    <text x="496" y="413" font-family="system-ui, sans-serif" font-size="10" fill="#5A6473">Type a message…</text>
    <circle cx="686" cy="409" r="12" fill="#D4A24E"/>
  </g>

  <!-- collapsed launcher (bottom-right, showing the two states) -->
  <circle cx="672" cy="424" r="0" fill="none"/>
  <text x="72" y="440" font-family="ui-monospace, monospace" font-size="11" fill="#6B7889">Single script embed · resizes itself · zero host-page CSS conflicts</text>
</svg>
