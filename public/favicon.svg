<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F6F8"/>
      <stop offset="100%" stop-color="#E8ECF0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.25" fill="none" stroke="#D4A24E" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Monogram "R", matching the navbar logo mark -->
  <text
    x="12.5"
    y="23.5"
    font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
    font-size="19"
    font-weight="700"
    fill="url(#letter)"
  >R</text>

  <!-- Accent dot, echoing the "Rohit." period in the site logo -->
  <circle cx="24" cy="23" r="2.6" fill="#D4A24E"/>
</svg>
